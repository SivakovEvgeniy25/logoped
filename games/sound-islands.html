<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Звуковые острова</title>
<style>
  :root{
    --card:#fffaf0;
    --ink:#20263a;
    --ok:#4caf7d;
    --bad:#e2596b;
    --coin:#ffd447;
    font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    background:#141830;
    color:var(--ink);
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    overflow-x:hidden;
  }
  #app{ max-width:680px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; color:#fff;
  }
  .topbar h1{ font-size:clamp(18px,5.5vw,26px); margin:0; text-shadow:0 2px 0 rgba(0,0,0,.4); }
  .coins{
    background:rgba(0,0,0,.35); border-radius:20px; padding:6px 14px;
    font-weight:bold; font-size:16px; color:var(--coin); display:flex; gap:6px; align-items:center;
  }
  .backlink{
    background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:14px;
    padding:6px 12px; font-family:inherit; font-size:14px; cursor:pointer;
  }
  #stage{ flex:1; padding:0 16px 24px; }

  /* ---------- world select ---------- */
  .worlds{ display:flex; flex-direction:column; gap:16px; margin-top:10px; }
  .world-card{
    border-radius:24px; padding:18px; color:#fff; cursor:pointer; border:none; text-align:left;
    box-shadow:0 10px 24px rgba(0,0,0,.4); display:flex; align-items:center; gap:14px;
    font-family:inherit; transition:.15s;
  }
  .world-card:active{ transform:scale(.98); }
  .world-card .mascot{ font-size:46px; }
  .world-card h2{ margin:0 0 4px; font-size:20px; }
  .world-card p{ margin:0; font-size:13px; opacity:.9; }

  /* ---------- level map (sound select) ---------- */
  .map-header{ text-align:center; color:#fff; margin:8px 0 16px; }
  .map-header .mascot{ font-size:56px; }
  .map-header h2{ margin:6px 0 2px; }
  .map-header p{ margin:0; font-size:13px; opacity:.85; }
  .level-path{
    display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding:10px 0;
  }
  .level-node{
    width:82px; height:82px; border-radius:50%; border:4px solid #fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; font-weight:bold; color:#fff; font-size:22px;
    box-shadow:0 6px 0 rgba(0,0,0,.35); position:relative;
  }
  .level-node:active{ transform:translateY(4px); box-shadow:none; }
  .level-node .sub{ font-size:11px; font-weight:normal; }

  /* ---------- variant chips ---------- */
  .variant-card{
    background:var(--card); border-radius:22px; padding:22px; margin-top:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.4); text-align:center;
  }
  .chip-row{ display:flex; flex-direction:column; gap:12px; margin-top:16px; }
  .chip{
    font-family:inherit; font-size:17px; padding:14px; border-radius:16px; border:3px solid var(--ink);
    background:#fff; cursor:pointer;
  }
  .chip.hard{ border-color:#3a6ea5; }
  .chip.soft{ border-color:#4caf7d; }
  .chip.mix{ border-color:#e08a3c; }
  .chip:active{ transform:scale(.98); }

  /* ---------- exercise card ---------- */
  .progress-path{ display:flex; gap:6px; justify-content:center; margin:8px 0 14px; }
  .pp-dot{ width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.3); }
  .pp-dot.done{ background:var(--coin); }
  .pp-dot.active{ background:#fff; transform:scale(1.3); }

  .card{
    background:var(--card); border-radius:24px; padding:22px; box-shadow:0 12px 30px rgba(0,0,0,.4);
    display:flex; flex-direction:column; align-items:center; text-align:center;
    animation:pop .3s ease;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .card{animation:none;} }

  .badge{
    font-size:12px; font-weight:bold; padding:4px 12px; border-radius:12px; color:#fff; margin-bottom:8px;
  }
  .pic{ font-size:72px; margin:4px 0; }
  .word-display{ font-size:clamp(28px,8vw,42px); letter-spacing:3px; font-weight:bold; margin:6px 0 18px; }
  .blank{ color:#e08a3c; border-bottom:5px solid #e08a3c; padding:0 4px; }

  .letter-row, .word-options, .classify-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .choice-btn{
    font-family:inherit; font-size:20px; padding:12px 18px; border-radius:16px; border:2px solid var(--ink);
    background:#fff; cursor:pointer;
  }
  .choice-btn.word{ font-size:16px; }
  .choice-btn.correct{ background:#e3f6e8; border-color:var(--ok); }
  .choice-btn.wrong{ background:#fbe6e8; border-color:var(--bad); }

  .big-choice{
    flex:1; min-width:130px; font-family:inherit; font-size:18px; font-weight:bold; padding:20px 10px;
    border-radius:18px; border:none; color:#fff; cursor:pointer;
  }
  .big-choice.hardbtn{ background:#3a6ea5; }
  .big-choice.softbtn{ background:#4caf7d; }
  .big-choice:active{ transform:scale(.97); }

  .feedback{ min-height:24px; font-weight:bold; margin-top:14px; }
  .feedback.ok{ color:var(--ok); }
  .feedback.bad{ color:var(--bad); }

  .primary-btn{
    font-family:inherit; font-size:16px; padding:12px 22px; border-radius:16px; border:none;
    background:#e08a3c; color:#fff; font-weight:bold; cursor:pointer; box-shadow:0 4px 0 #a85f1e; margin-top:16px;
  }
  .primary-btn:active{ transform:translateY(3px); box-shadow:none; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="pageTitle">🎮 Звуковые острова</h1>
    <div class="coins">🪙 <span id="coinCount">0</span></div>
  </div>
  <div id="stage"></div>
</div>

<script>
/* =========================================================
   ДАННЫЕ: группы звуков по месту образования + твёрдость/мягкость
   ========================================================= */
const GROUPS = {
  front: {
    title: "Остров Языка-Кончика",
    subtitle: "Переднеязычные звуки — кончик языка у зубов",
    grad: "linear-gradient(160deg,#2d6a4f,#123524)",
    accent: "#ffd166",
    mascot: "🦔",
    sounds: {
      "Р": { emoji:"🦊",
        hard:[ {word:"рыба",pic:"🐟",idx:0}, {word:"корова",pic:"🐄",idx:2}, {word:"топор",pic:"🪓",idx:4} ],
        soft:[ {word:"река",pic:"🏞️",idx:0}, {word:"берёза",pic:"🌳",idx:2}, {word:"варенье",pic:"🍯",idx:2} ] },
      "Л": { emoji:"🐺",
        hard:[ {word:"лампа",pic:"💡",idx:0}, {word:"стол",pic:"🪑",idx:3}, {word:"белка",pic:"🐿️",idx:2} ],
        soft:[ {word:"лес",pic:"🌲",idx:0}, {word:"апельсин",pic:"🍊",idx:3}, {word:"мебель",pic:"🛋️",idx:4} ] },
      "С": { emoji:"🐝",
        hard:[ {word:"сумка",pic:"👜",idx:0}, {word:"сова",pic:"🦉",idx:0}, {word:"нос",pic:"👃",idx:2} ],
        soft:[ {word:"сирень",pic:"🌸",idx:0}, {word:"письмо",pic:"✉️",idx:2}, {word:"гусеница",pic:"🐛",idx:3} ] },
      "З": { emoji:"🦓",
        hard:[ {word:"зонт",pic:"☂️",idx:0}, {word:"коза",pic:"🐐",idx:2}, {word:"ваза",pic:"🏺",idx:2} ],
        soft:[ {word:"зима",pic:"❄️",idx:0}, {word:"земляника",pic:"🍓",idx:0}, {word:"обезьяна",pic:"🐒",idx:3} ] },
      "Ш": { emoji:"🐍", hard:[ {word:"шапка",pic:"🧢",idx:0}, {word:"кошка",pic:"🐱",idx:2}, {word:"мышь",pic:"🐭",idx:2} ] },
      "Ж": { emoji:"🪲", hard:[ {word:"жук",pic:"🪲",idx:0}, {word:"ёжик",pic:"🦔",idx:1}, {word:"лыжи",pic:"⛷️",idx:2} ] },
      "Ц": { emoji:"🐤", hard:[ {word:"цветок",pic:"🌸",idx:0}, {word:"огурец",pic:"🥒",idx:4}, {word:"яйцо",pic:"🥚",idx:2} ] },
      "Ч": { emoji:"🦋", soft:[ {word:"чашка",pic:"☕",idx:0}, {word:"бабочка",pic:"🦋",idx:4}, {word:"ключ",pic:"🔑",idx:3} ] },
      "Щ": { emoji:"🐶", soft:[ {word:"щенок",pic:"🐶",idx:0}, {word:"ящик",pic:"📦",idx:2}, {word:"плащ",pic:"🧥",idx:3} ] },
    }
  },
  mid: {
    title: "Островок Средний",
    subtitle: "Среднеязычный звук — средняя часть языка у нёба",
    grad: "linear-gradient(160deg,#5e548e,#231942)",
    accent: "#9de0ff",
    mascot: "🐦",
    sounds: {
      "Й": { emoji:"🐦", soft:[ {word:"йогурт",pic:"🥣",idx:0}, {word:"чайка",pic:"🐦",idx:2}, {word:"майка",pic:"👕",idx:2} ] },
    }
  },
  back: {
    title: "Горы Заднего Языка",
    subtitle: "Заднеязычные звуки — задняя часть языка у нёба",
    grad: "linear-gradient(160deg,#bb6a2e,#5f3113)",
    accent: "#ffe08a",
    mascot: "🐐",
    sounds: {
      "К": { emoji:"🐱",
        hard:[ {word:"кот",pic:"🐱",idx:0}, {word:"рука",pic:"✋",idx:2}, {word:"молоко",pic:"🥛",idx:3} ],
        soft:[ {word:"кит",pic:"🐳",idx:0}, {word:"кенгуру",pic:"🦘",idx:0}, {word:"носки",pic:"🧦",idx:3} ] },
      "Г": { emoji:"🐐",
        hard:[ {word:"гора",pic:"⛰️",idx:0}, {word:"нога",pic:"🦵",idx:2}, {word:"радуга",pic:"🌈",idx:4} ],
        soft:[ {word:"гитара",pic:"🎸",idx:0}, {word:"гиря",pic:"🏋️",idx:0}, {word:"сапоги",pic:"👢",idx:4} ] },
      "Х": { emoji:"🐓",
        hard:[ {word:"хлеб",pic:"🍞",idx:0}, {word:"муха",pic:"🪰",idx:2}, {word:"петух",pic:"🐓",idx:4} ],
        soft:[ {word:"духи",pic:"🧴",idx:2}, {word:"орехи",pic:"🌰",idx:3}, {word:"мухи",pic:"🪰",idx:2} ] },
    }
  }
};

const ALL_LETTERS = "АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЭЮЯ".split("");

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let coins = 0;
let curGroupKey = null, curSoundKey = null, curVariant = null;
let queue = [];
let queueTotal = 0;

const stage = document.getElementById("stage");
const coinEl = document.getElementById("coinCount");
const titleEl = document.getElementById("pageTitle");

function setCoins(n){ coins = n; coinEl.textContent = coins; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function bg(color1){ document.body.style.background = color1; }

/* =========================================================
   ЭКРАН 1 — выбор острова (группы звуков)
   ========================================================= */
function renderWorlds(){
  titleEl.textContent = "🎮 Звуковые острова";
  bg("#141830");
  stage.innerHTML = `<div class="worlds">
    ${Object.entries(GROUPS).map(([key,g])=>`
      <button class="world-card" style="background:${g.grad}" data-g="${key}">
        <div class="mascot">${g.mascot}</div>
        <div>
          <h2>${g.title}</h2>
          <p>${g.subtitle}</p>
        </div>
      </button>`).join("")}
  </div>`;
  stage.querySelectorAll(".world-card").forEach(b=> b.onclick = ()=> renderLevelMap(b.dataset.g));
}

/* =========================================================
   ЭКРАН 2 — карта уровней (звуки внутри острова)
   ========================================================= */
function renderLevelMap(groupKey){
  curGroupKey = groupKey;
  const g = GROUPS[groupKey];
  titleEl.textContent = g.title;
  bg(g.grad);
  stage.innerHTML = `
    <button class="backlink" id="back">← Все острова</button>
    <div class="map-header">
      <div class="mascot">${g.mascot}</div>
      <h2>${g.title}</h2>
      <p>${g.subtitle}</p>
    </div>
    <div class="level-path" id="levelPath"></div>
  `;
  document.getElementById("back").onclick = renderWorlds;
  const path = document.getElementById("levelPath");
  Object.entries(g.sounds).forEach(([soundKey,s])=>{
    const node = document.createElement("div");
    node.className = "level-node";
    node.style.background = g.accent;
    node.style.color = "#3a2a00";
    node.innerHTML = `<div>${soundKey}</div><div class="sub">${s.emoji}</div>`;
    node.onclick = ()=> renderVariantPicker(groupKey, soundKey);
    path.appendChild(node);
  });
}

/* =========================================================
   ЭКРАН 3 — твёрдый / мягкий / оба
   ========================================================= */
function renderVariantPicker(groupKey, soundKey){
  curSoundKey = soundKey;
  const g = GROUPS[groupKey];
  const s = g.sounds[soundKey];
  bg(g.grad);
  const hasHard = !!s.hard, hasSoft = !!s.soft;

  if(hasHard && !hasSoft){ startRound(groupKey, soundKey, "hard"); return; }
  if(hasSoft && !hasHard){ startRound(groupKey, soundKey, "soft"); return; }

  stage.innerHTML = `
    <button class="backlink" id="back">← К карте острова</button>
    <div class="variant-card">
      <div style="font-size:46px;">${s.emoji}</div>
      <h2>Звук [${soundKey}]</h2>
      <p>Какой звук будем тренировать?</p>
      <div class="chip-row">
        <button class="chip hard" id="pickHard">🔵 Твёрдый (${s.hard[0].word})</button>
        <button class="chip soft" id="pickSoft">🟢 Мягкий (${s.soft[0].word})</button>
        <button class="chip mix" id="pickMix">🟠 Оба вместе — учимся различать</button>
      </div>
    </div>
  `;
  document.getElementById("back").onclick = ()=>renderLevelMap(groupKey);
  document.getElementById("pickHard").onclick = ()=>startRound(groupKey, soundKey, "hard");
  document.getElementById("pickSoft").onclick = ()=>startRound(groupKey, soundKey, "soft");
  document.getElementById("pickMix").onclick = ()=>startRound(groupKey, soundKey, "both");
}

/* =========================================================
   СБОРКА РАУНДА
   ========================================================= */
function startRound(groupKey, soundKey, variant){
  curGroupKey = groupKey; curSoundKey = soundKey; curVariant = variant;
  const s = GROUPS[groupKey].sounds[soundKey];
  let words = [];
  if(variant === "hard" || variant === "both") words = words.concat((s.hard||[]).map(w=>({...w,hardness:"hard"})));
  if(variant === "soft" || variant === "both") words = words.concat((s.soft||[]).map(w=>({...w,hardness:"soft"})));
  shuffle(words);
  words = words.slice(0, variant === "both" ? 6 : 3); // компактный аркадный уровень

  queue = [];
  words.forEach(w=>{
    queue.push({type:"insert", ...w});
    queue.push({type:"guess", ...w});
    if(variant === "both") queue.push({type:"classify", ...w});
  });
  queueTotal = queue.length;
  nextExercise();
}

function renderProgressPath(){
  const done = queueTotal - queue.length;
  return `<div class="progress-path">${Array.from({length:queueTotal}).map((_,i)=>{
    let cls = "pp-dot";
    if(i < done) cls += " done"; else if(i === done) cls += " active";
    return `<div class="${cls}"></div>`;
  }).join("")}</div>`;
}

function badgeColor(hardness){ return hardness === "hard" ? "#3a6ea5" : "#4caf7d"; }
function badgeText(hardness){ return hardness === "hard" ? "Твёрдый звук" : "Мягкий звук"; }

function nextExercise(){
  if(queue.length === 0){ renderLevelComplete(); return; }
  const ex = queue[0];
  if(ex.type === "insert") renderInsert(ex);
  else if(ex.type === "guess") renderGuess(ex);
  else if(ex.type === "classify") renderClassify(ex);
}

/* ---------- Мини-игра 1: вставь пропущенный звук ---------- */
function renderInsert(item){
  const letters = item.word.split("");
  const target = letters[item.idx].toUpperCase();
  const display = letters.map((ch,i)=> i===item.idx ? `<span class="blank">_</span>` : ch).join("");

  stage.innerHTML = `
    <button class="backlink" id="back">← Другой уровень</button>
    ${renderProgressPath()}
    <div class="card">
      <div class="badge" style="background:${badgeColor(item.hardness)}">${badgeText(item.hardness)}</div>
      <div class="pic">${item.pic}</div>
      <div class="word-display">${display}</div>
      <div class="letter-row" id="row"></div>
      <div class="feedback" id="fb"></div>
    </div>
  `;
  document.getElementById("back").onclick = ()=>renderVariantPicker(curGroupKey, curSoundKey);

  const pool = shuffle(ALL_LETTERS.filter(l=>l!==target)).slice(0,3);
  const options = shuffle([target, ...pool]);
  const row = document.getElementById("row");
  const fb = document.getElementById("fb");
  options.forEach(letter=>{
    const b = document.createElement("button");
    b.className = "choice-btn"; b.textContent = letter;
    b.onclick = ()=>{
      const correct = letter === target;
      [...row.children].forEach(x=>x.disabled=true);
      b.classList.add(correct?"correct":"wrong");
      if(correct){
        fb.textContent = "Верно! Слово: " + item.word; fb.className = "feedback ok";
        setCoins(coins+1);
        setTimeout(()=>{ queue[0] = null; queue.shift(); nextExercise(); }, 850);
      } else {
        fb.textContent = "Почти! Попробуй ещё раз."; fb.className = "feedback bad";
        setTimeout(()=>{ [...row.children].forEach(x=>{x.disabled=false; x.classList.remove("wrong");}); fb.textContent=""; }, 650);
      }
    };
    row.appendChild(b);
  });
}

/* ---------- Мини-игра 2: угадай пропущенное слово ---------- */
function renderGuess(item){
  const masked = item.word.split("").map((ch,i,arr)=> (i===0||i===arr.length-1) ? ch.toUpperCase() : "_").join("");
  const distractors = pickDistractorWords(item);
  const options = shuffle([item.word, ...distractors]);

  stage.innerHTML = `
    <button class="backlink" id="back">← Другой уровень</button>
    ${renderProgressPath()}
    <div class="card">
      <div class="badge" style="background:${badgeColor(item.hardness)}">${badgeText(item.hardness)}</div>
      <div class="pic">${item.pic}</div>
      <div class="word-display">${masked}</div>
      <div class="word-options" id="row"></div>
      <div class="feedback" id="fb"></div>
    </div>
  `;
  document.getElementById("back").onclick = ()=>renderVariantPicker(curGroupKey, curSoundKey);

  const row = document.getElementById("row");
  const fb = document.getElementById("fb");
  options.forEach(word=>{
    const b = document.createElement("button");
    b.className = "choice-btn word"; b.textContent = word;
    b.onclick = ()=>{
      const correct = word === item.word;
      [...row.children].forEach(x=>x.disabled=true);
      b.classList.add(correct?"correct":"wrong");
      if(correct){
        fb.textContent = "Отлично, слово угадано!"; fb.className = "feedback ok";
        setCoins(coins+1);
        setTimeout(()=>{ queue.shift(); nextExercise(); }, 850);
      } else {
        fb.textContent = "Не то слово — смотри на картинку!"; fb.className = "feedback bad";
        setTimeout(()=>{ [...row.children].forEach(x=>{x.disabled=false; x.classList.remove("wrong");}); fb.textContent=""; }, 650);
      }
    };
    row.appendChild(b);
  });
}

function pickDistractorWords(item){
  const bank = [];
  Object.values(GROUPS).forEach(g=>{
    Object.values(g.sounds).forEach(s=>{
      (s.hard||[]).forEach(w=>bank.push(w.word));
      (s.soft||[]).forEach(w=>bank.push(w.word));
    });
  });
  const similar = shuffle(bank.filter(w=> w!==item.word && Math.abs(w.length-item.word.length)<=1));
  return similar.slice(0,2);
}

/* ---------- Мини-игра 3: твёрдый или мягкий? ---------- */
function renderClassify(item){
  stage.innerHTML = `
    <button class="backlink" id="back">← Другой уровень</button>
    ${renderProgressPath()}
    <div class="card">
      <div class="pic">${item.pic}</div>
      <div class="word-display">${item.word.toUpperCase()}</div>
      <p style="margin-top:-8px;">Звук [${curSoundKey}] в этом слове...</p>
      <div class="classify-row">
        <button class="big-choice hardbtn" id="bHard">🔵 Твёрдый</button>
        <button class="big-choice softbtn" id="bSoft">🟢 Мягкий</button>
      </div>
      <div class="feedback" id="fb"></div>
    </div>
  `;
  document.getElementById("back").onclick = ()=>renderVariantPicker(curGroupKey, curSoundKey);
  const fb = document.getElementById("fb");
  const hardBtn = document.getElementById("bHard");
  const softBtn = document.getElementById("bSoft");
  function answer(choice){
    const correct = choice === item.hardness;
    hardBtn.disabled = true; softBtn.disabled = true;
    (correct ? (choice==="hard"?hardBtn:softBtn) : (choice==="hard"?hardBtn:softBtn)).style.outline = correct ? "4px solid #4caf7d" : "4px solid #e2596b";
    if(correct){
      fb.textContent = "Точно! Молодец!"; fb.className = "feedback ok";
      setCoins(coins+1);
      setTimeout(()=>{ queue.shift(); nextExercise(); }, 800);
    } else {
      fb.textContent = "Не совсем — послушай слово ещё раз мысленно."; fb.className = "feedback bad";
      setTimeout(()=>{ hardBtn.disabled=false; softBtn.disabled=false; hardBtn.style.outline=""; softBtn.style.outline=""; fb.textContent=""; }, 800);
    }
  }
  hardBtn.onclick = ()=>answer("hard");
  softBtn.onclick = ()=>answer("soft");
}

/* ---------- Завершение уровня ---------- */
function renderLevelComplete(){
  stage.innerHTML = `
    <div class="card">
      <div class="pic">🏆</div>
      <h2>Уровень «${curSoundKey}» пройден!</h2>
      <p>Собрано монет: 🪙 ${coins}</p>
      <button class="primary-btn" id="toMap">К карте острова</button>
      <button class="primary-btn" id="toWorlds" style="background:#3a6ea5; box-shadow:0 4px 0 #234a72;">Все острова</button>
    </div>
  `;
  document.getElementById("toMap").onclick = ()=>renderLevelMap(curGroupKey);
  document.getElementById("toWorlds").onclick = renderWorlds;
}

/* =========================================================
   СТАРТ
   ========================================================= */
setCoins(0);
renderWorlds();
</script>
</body>
</html>
